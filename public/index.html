<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Saage Free Trade Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10243A;--em:#10A875;--bg:#F5F7FA;--ink:#182230;--mut:#687586;--card:#fff;--bd:#e3e8ef;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0b1623;--ink:#e8edf3;--mut:#9aa7b6;--card:#122235;--bd:#223650}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.w{max-width:1100px;margin:auto;padding:0 14px}.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:700;color:#fff;text-decoration:none;font-size:16px}.logo i{color:var(--em);font-style:normal}
nav a,.tabs a{color:inherit;text-decoration:none;margin-right:14px;font-weight:600;font-size:13px;white-space:nowrap}
nav{display:flex;overflow-x:auto;align-items:center}nav a:hover{color:var(--em)}
.tabs{background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;padding:8px 14px}.tabs a{color:var(--mut)}.tabs a.on{color:var(--em)}
main{max-width:1100px;margin:auto;padding:16px 14px 40px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:18px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.b{background:var(--em);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}.b2{background:var(--card);color:var(--ink);border:1px solid var(--bd)}.bs{padding:4px 10px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin:3px 0 10px}label{font-weight:600;font-size:12px;color:var(--mut)}
.bd{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:600;background:var(--bd);color:var(--ink)}.ok{background:#10A8751f;color:var(--em)}.wr{background:#f59e0b22;color:#b45309}.er{background:#ef444422;color:#dc2626}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mut);font-weight:600}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:28px 18px}.hero h1{font-size:28px}.hero p{color:#cbd5e1;max-width:520px}
.em{font-size:38px;text-align:center;background:var(--bg);border-radius:8px;padding:14px;margin-bottom:8px}.mut{color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--em)}.big{font-size:24px;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px}.chart i{flex:1;background:var(--em);border-radius:4px 4px 0 0;opacity:.85}
.chat{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;margin-bottom:8px}.m1,.m2{padding:7px 11px;border-radius:12px;max-width:80%}.m1{background:var(--em);color:#fff;align-self:flex-end}.m2{background:var(--bd)}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.tl div{position:relative;padding:3px 0}.tl div:before{content:"";position:absolute;left:-18px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--bd)}.tl .d:before{background:var(--em)}.tl .d{font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 14px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;z-index:9}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R={USD:1,NGN:1500,GBP:.79,EUR:.92,CNY:7.2,JPY:150},ST=['Pending confirmation','Confirmed','Awaiting payment','Payment processing','Processing','Ready for shipment','Shipped','In transit','Customs clearance','Delivered','Completed','Cancelled','Disputed'];
let S={u:null,cur:'USD',saved:[],q:{},rf:null,ch:0};
try{S.u=JSON.parse(localStorage.getItem('u'))}catch(e){}
const D={
P:[[1,'Industrial Generator 500kVA','Industrial Equipment',2500,'unit','CN',2,1,'⚙️'],[2,'Long-grain Parboiled Rice','Food & Beverages',420,'tonne','TH',100,3,'🌾'],[3,'Raw Cocoa Beans','Agriculture',2800,'tonne','NG',20,2,'🍫'],[4,'Cotton Fabric Rolls','Textiles',3.2,'metre','GH',1000,4,'🧵'],[5,'Laptop Computers i7','Electronics',650,'unit','CN',50,1,'💻'],[6,'Portland Cement 42.5','Construction Materials',95,'tonne','NG',200,2,'🏗️'],[7,'Crude Palm Oil','Oil & Gas',900,'tonne','NG',50,2,'🛢️'],[8,'Hydraulic Excavator','Machinery',48000,'unit','CN',1,1,'🚜']].map(a=>({id:a[0],n:a[1],c:a[2],p:a[3],u:a[4],o:a[5],moq:a[6],s:a[7],e:a[8]})),
B:[[1,'Globex Manufacturing Ltd','CN','Manufacturer',1,4.8,'Shanghai'],[2,'Lagos Agro Exports','NG','Exporter',1,4.6,'Lagos'],[3,'Thai Rice Co.','TH','Supplier',1,4.7,'Bangkok'],[4,'Accra Textiles','GH','Wholesaler',0,4.1,'Accra'],[5,'Maersk Logistics','DK','Logistics',1,4.5,'Copenhagen'],[6,'DHL Freight','DE','Logistics',1,4.4,'Bonn']].map(a=>({id:a[0],n:a[1],k:a[2],t:a[3],v:a[4],r:a[5],city:a[6]})),
RFQ:[{id:1,t:'5,000 tonnes of long-grain rice',cat:'Food & Beverages',q:5000,u:'tonne',tp:410,dest:'NG',by:'2026-12-20',st:'Open',buyer:'Lagos Importers Ltd',quotes:[{id:1,s:'Thai Rice Co.',p:425,q:5000,days:35,st:'Pending'},{id:2,s:'Vietnam Grain Co.',p:415,q:3000,days:40,st:'Pending'}]},{id:2,t:'200 units hydraulic pumps',cat:'Machinery',q:200,u:'unit',tp:900,dest:'GH',by:'2027-01-15',st:'Open',buyer:'Accra Mining',quotes:[]}],
O:[{id:'ORD-1001',p:'Industrial Generator 500kVA',qty:2,amt:5000,b:'Lagos Importers Ltd',s:'Globex Manufacturing Ltd',st:7},{id:'ORD-1002',p:'Long-grain Parboiled Rice',qty:300,amt:126000,b:'Lagos Importers Ltd',s:'Thai Rice Co.',st:2},{id:'ORD-1003',p:'Raw Cocoa Beans',qty:40,amt:112000,b:'Rotterdam Foods',s:'Lagos Agro Exports',st:10}],
SH:[{id:'TRK-7781',o:'ORD-1001',co:'Maersk Logistics',f:'Shanghai, CN',t:'Lagos, NG',loc:'Indian Ocean',st:'In transit',pct:55,eta:'2026-12-02'},{id:'TRK-7790',o:'ORD-1003',co:'DHL Freight',f:'Lagos, NG',t:'Rotterdam, NL',loc:'Delivered',st:'Delivered',pct:100,eta:'2026-10-30'}],
DOC:[['Commercial invoice','ORD-1001','Approved'],['Packing list','ORD-1001','Approved'],['Bill of lading','ORD-1001','Pending'],['Certificate of origin','ORD-1003','Approved']],
DIS:[{id:'DSP-201',o:'ORD-1002',r:'Delayed shipment',st:'Under review'}],
REV:[['Lagos Importers Ltd','Globex Manufacturing Ltd',5,'Excellent quality and communication.'],['Rotterdam Foods','Lagos Agro Exports',4,'Good beans, slight delay at port.']],
N:[['New quotation received on RFQ #1',0],['Order ORD-1001 is in transit',0],['Your business verification was approved',1]],
USERS:[['Ada Obi','ada@lagosimporters.ng','Importer','Active'],['Li Wei','li@globex.cn','Manufacturer','Active'],['Sam Nkosi','sam@jozilogistics.za','Logistics','Suspended']],
VER:[{n:'Accra Textiles',k:'GH',docs:3,st:'Pending'},{n:'Kenya Tea Traders',k:'KE',docs:4,st:'Pending'}],
PAY:[['PAY-501','ORD-1002','NGN','126,000 USD','Paid','Flutterwave'],['PAY-502','ORD-1003','USD','112,000','Paid','Flutterwave'],['PAY-503','ORD-1001','USD','5,000','Awaiting','-']],
CHAT:[[['them','Hello, is the price negotiable for 500 units?'],['me','Yes, we can discuss for bulk orders.']],[['them','Please share the bill of lading.']]],
CONT:['Globex Manufacturing','Thai Rice Co.']};
const m=(n,c='USD')=>(S.cur==='USD'?'':'≈ ')+S.cur+' '+Math.round(n*R[S.cur]).toLocaleString();
const bd=(t,k)=>`<span class="bd ${k||''}">${E(t)}</span>`,vb=b=>b.v?bd('✔ Verified','ok'):bd('Unverified');
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const em=t=>`<div class="c mut" style="text-align:center">${t}</div>`,stat=(l,v)=>`<div class="c"><div class="mut">${l}</div><div class="big">${v}</div></div>`;
const chart=a=>`<div class="c"><div class="chart">${a.map(v=>`<i style="height:${v}%"></i>`).join('')}</div></div>`;
const bz=id=>D.B.find(b=>b.id==id)||{};
const pcard=p=>`<a href="#/product/${p.id}" class="c" style="text-decoration:none;color:inherit"><div class="em">${p.e}</div><b>${E(p.n)}</b><div style="color:var(--em);font-weight:700">${m(p.p)} <span class="mut">/ ${p.u}</span></div><div class="mut">${bz(p.s).n} · ${p.o}</div>${vb(bz(p.s))}</a>`;
const fld=(l,n,t='text',x='')=>`<label>${l}<${t=='textarea'?'textarea':t=='select'?'select':'input'} name="${n}" ${t=='select'?'':t=='textarea'?'':'type="'+t+'"'} required>${t=='select'?x:''}${t=='textarea'?'</textarea>':t=='select'?'</select>':''}`.replace(/(<(input)[^>]*)>$/,'$1>')+'</label>';
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
const info=(t,ps)=>`<h1>${t}</h1><div class="c">${ps.map(p=>`<p>${p}</p>`).join('')}</div>`;
const roleTabs={buyer:[['dash','Overview'],['saved','Saved'],['rfqs','My RFQs'],['orders','Orders'],['payments','Payments'],['shipments','Shipments'],['messages','Messages'],['docs','Documents'],['disputes','Disputes']],seller:[['dash','Overview'],['myprod','Products'],['rfqs','RFQ opportunities'],['orders','Orders'],['messages','Messages'],['reviews','Reviews'],['docs','Documents']],logistics:[['dash','Overview'],['shipments','Shipments'],['shipq','Shipping requests'],['messages','Messages']],investor:[['dash','Overview'],['dir','Businesses'],['saved','Saved'],['messages','Messages']],admin:[['admin','Overview'],['a-users','Users'],['a-verify','Verification'],['a-orders','Orders'],['a-pay','Payments'],['a-disp','Disputes'],['a-an','Analytics']]};
const grp=r=>r=='admin'?'admin':r=='logistics'?'logistics':r=='investor'?'investor':['importer'].includes(r)?'buyer':'seller';
const V={
'':()=>`<div class="hero"><h1>Global trade. Boundless opportunities.</h1><p>Connect African and international importers, exporters, manufacturers and logistics companies in one marketplace.</p><div class="row"><a class="b" href="#/market">Browse marketplace</a><a class="b b2" href="#/login">Start trading</a></div></div><h2>Why Saage</h2><div class="g">${[['🌍','Global marketplace'],['🏢','Business directory'],['📝','RFQ platform'],['🚢','Logistics solutions'],['🔒','Secure trade']].map(a=>`<div class="c"><div class="big">${a[0]}</div><b>${a[1]}</b></div>`).join('')}</div><h2>Featured products</h2><div class="g">${D.P.slice(0,4).map(pcard).join('')}</div>`,
about:()=>info('About Saage Free Trade Zone',['Saage Free Trade Zone connects African and international businesses with verified manufacturers, suppliers, exporters, importers and logistics companies.','We are a marketplace. We are not a bank and we do not hold customer funds. Payments run through approved providers.']),
how:()=>`<h1>How it works</h1><div class="g">${[['Register','Create your business account.'],['Find','Search products, suppliers and RFQs.'],['Trade','Negotiate, order and pay securely.'],['Grow','Ship, track and build your reputation.']].map((a,i)=>`<div class="c"><div class="big">${i+1}</div><b>${a[0]}</b><p class="mut">${a[1]}</p></div>`).join('')}</div>`,
pricing:()=>`<h1>Pricing</h1><div class="g">${[['Free','$0','Basic listings, 5 RFQ responses a month'],['Premium','Set by admin','Featured listings, premium RFQ visibility'],['Logistics ads','Set by admin','Promote your freight services']].map(a=>`<div class="c"><b>${a[0]}</b><div class="big">${a[1]}</div><p class="mut">${a[2]}</p></div>`).join('')}</div><p class="mut">Commissions and fees are configured by administrators.</p>`,
contact:()=>`<h1>Contact us</h1><form class="c" data-f="contact">${fld('Name','n')}${fld('Email','e','email')}${fld('Message','m','textarea')}<button class="b">Send message</button></form>`,
terms:()=>info('Terms and conditions',['Saage Free Trade Zone is a trade marketplace, not a licensed bank or escrow service.','Dispute handling is not legal arbitration and recovery of funds is not guaranteed.']),
privacy:()=>info('Privacy policy',['We collect business and account details to run the marketplace and verify businesses. Secret keys are never exposed to the browser.']),
help:()=>`<h1>Help center</h1>${[['How do I get verified?','Submit your registration documents. An administrator reviews them. Nothing is verified automatically.'],['How do payments work?','Approved providers such as Flutterwave process payments. Success is confirmed server-side.'],['How do I open a dispute?','Go to Disputes in your dashboard and select the order.'],['Are converted prices exact?','No. Converted prices are estimates. The agreed currency never changes.']].map(a=>`<details class="c" style="margin-bottom:8px"><summary><b>${a[0]}</b></summary><p>${a[1]}</p></details>`).join('')}`,
login:()=>`<form class="c" data-f="login" style="max-width:420px;margin:auto"><h1>Sign in</h1><p class="mut">Test mode: any email and password works. Nothing is sent anywhere.</p>${fld('Email','e','email')}${fld('Password','p','password')}<label>Test as<select name="r">${opts(['importer','exporter','manufacturer','supplier','wholesaler','distributor','logistics','investor','admin'])}</select></label><button class="b">Sign in</button> <a href="#/register">Create account</a></form>`,
register:()=>`<form class="c" data-f="login" style="max-width:420px;margin:auto"><h1>Create account</h1>${fld('Business name','bn')}${fld('Email','e','email')}${fld('Password','p','password')}<label>Business type<select name="r">${opts(['importer','exporter','manufacturer','supplier','wholesaler','distributor','logistics','investor'])}</select></label><button class="b">Register</button></form>`,
market:()=>{S.rf=()=>{const q=S.q,r=D.P.filter(p=>(!q.s||p.n.toLowerCase().includes(q.s.toLowerCase()))&&(!q.c||p.c==q.c)&&(!q.o||p.o==q.o)&&(!q.p||p.p<=+q.p)&&(!q.v||bz(p.s).v));return r.length?`<div class="g">${r.map(pcard).join('')}</div>`:em('No products match these filters.')};return`<h1>Marketplace</h1><div class="c g"><input data-q="s" placeholder="Search products"><select data-q="c"><option value="">All categories</option>${opts([...new Set(D.P.map(p=>p.c))])}</select><select data-q="o"><option value="">Any origin</option>${opts([...new Set(D.P.map(p=>p.o))])}</select><input data-q="p" type="number" placeholder="Max price (USD)"><label><input data-q="v" type="checkbox" style="width:auto"> Verified only</label></div><br><div id="res">${S.rf()}</div>`},
product:a=>{const p=D.P.find(x=>x.id==a),s=bz(p.s);return`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="c"><div class="em" style="font-size:90px">${p.e}</div></div><div><h1>${E(p.n)}</h1><div class="big" style="color:var(--em)">${m(p.p)} <span class="mut" style="font-size:13px">/ ${p.u} · original USD ${p.p}</span></div><p class="mut">Category: ${p.c} · Origin: ${p.o} · MOQ: ${p.moq} ${p.u} · Negotiable</p><p>Supplier: <a href="#/biz/${s.id}">${s.n}</a> ${vb(s)}</p><div class="row"><button class="b" data-a="quote" data-id="${p.id}">Request quotation</button><button class="b b2" data-a="order" data-id="${p.id}">Order now</button><button class="b b2" data-a="save" data-id="${p.id}">${S.saved.includes(p.id)?'Saved ✔':'Save'}</button><a class="b b2" href="#/messages">Contact</a></div></div></div>`},
dir:()=>{S.rf=()=>{const q=S.q,r=D.B.filter(b=>(!q.s||b.n.toLowerCase().includes(q.s.toLowerCase()))&&(!q.k||b.k==q.k)&&(!q.t||b.t==q.t));return r.length?`<div class="g">${r.map(b=>`<a href="#/biz/${b.id}" class="c" style="text-decoration:none;color:inherit"><b>${b.n}</b><div class="mut">${b.t} · ${b.city}, ${b.k}</div>${vb(b)} ⭐ ${b.r}</a>`).join('')}</div>`:em('No businesses found.')};return`<h1>Business directory</h1><div class="c g"><input data-q="s" placeholder="Company name"><select data-q="k"><option value="">All countries</option>${opts([...new Set(D.B.map(b=>b.k))])}</select><select data-q="t"><option value="">All types</option>${opts([...new Set(D.B.map(b=>b.t))])}</select></div><br><div id="res">${S.rf()}</div>`},
biz:a=>{const b=bz(a);return`<h1>${b.n} ${vb(b)}</h1><div class="c"><p class="mut">${b.t} · ${b.city}, ${b.k} · ⭐ ${b.r}</p><p>Verified trading company with international export experience.</p><a class="b" href="#/messages">Send inquiry</a></div><h2>Products</h2><div class="g">${D.P.filter(p=>p.s==b.id).map(pcard).join('')||em('No products listed.')}</div>`},
rfqs:()=>`<div class="row sp"><h1>RFQ marketplace</h1><a class="b" href="#/rfqnew">Create RFQ</a></div><div class="g">${D.RFQ.map(r=>`<a href="#/rfq/${r.id}" class="c" style="text-decoration:none;color:inherit"><b>${E(r.t)}</b><div class="mut">${r.buyer} → ${r.dest} · by ${r.by}</div><div>Target ${m(r.tp)} / ${r.u}</div>${bd(r.st,'ok')} ${bd(r.quotes.length+' quotes')}</a>`).join('')}</div>`,
rfqnew:()=>`<h1>Create RFQ</h1><form class="c" data-f="rfq">${fld('Product name','t')}${fld('Description and specifications','d','textarea')}<label>Category<select name="cat">${opts(['Agriculture','Food & Beverages','Machinery','Electronics','Textiles','Chemicals'])}</select></label>${fld('Quantity','q','number')}${fld('Unit','u')}${fld('Target price (USD)','tp','number')}${fld('Preferred origin','o')}${fld('Delivery destination (country code)','dest')}${fld('Required delivery date','by','date')}<button class="b">Publish RFQ</button></form>`,
rfq:a=>{const r=D.RFQ.find(x=>x.id==a);return`<h1>${E(r.t)}</h1><div class="c"><p>${r.q} ${r.u} → ${r.dest} · target ${m(r.tp)} · by ${r.by}</p>${bd(r.st,'ok')}</div><h2>Quotations</h2>${r.quotes.length?tbl(['Supplier','Price','Qty','Days','Status',''],r.quotes.map(q=>[q.s,m(q.p),q.q,q.days,bd(q.st,q.st=='Accepted'?'ok':q.st=='Rejected'?'er':''),q.st=='Pending'?`<button class="b bs" data-a="acc" data-r="${r.id}" data-q="${q.id}">Accept</button> <button class="b b2 bs" data-a="rej" data-r="${r.id}" data-q="${q.id}">Reject</button>`:''])):em('No quotations yet.')}<h2>Submit your quotation</h2><form class="c" data-f="quote" data-r="${r.id}">${fld('Unit price (USD)','p','number')}${fld('Available quantity','q','number')}${fld('Delivery terms (Incoterm)','i')}${fld('Estimated delivery (days)','days','number')}<button class="b">Submit quotation</button></form>`},
messages:()=>{const c=S.ch;return`<h1>Negotiation and messages</h1><div class="g" style="grid-template-columns:1fr 2fr"><div class="c">${D.CONT.map((n,i)=>`<div><a href="#" data-a="chat" data-i="${i}" style="${i==c?'font-weight:700;color:var(--em)':''}">${n}</a></div>`).join('')}</div><div class="c"><div class="chat">${D.CHAT[c].map(x=>`<div class="${x[0]=='me'?'m1':'m2'}">${E(x[1])}</div>`).join('')}</div><form data-f="msg" class="row"><input name="t" placeholder="Type a message" required style="flex:1;margin:0"><button class="b">Send</button></form></div></div>`},
orders:()=>`<h1>Orders</h1>${tbl(['Order','Product','Qty','Total','Status',''],D.O.map(o=>[o.id,o.p,o.qty,m(o.amt),bd(ST[o.st],o.st==10?'ok':o.st==11||o.st==12?'er':'wr'),`<a class="b b2 bs" href="#/order/${o.id}">Track</a>`]))}`,
order:a=>{const o=D.O.find(x=>x.id==a);return`<h1>${o.id} · Track shipment</h1><div class="c"><b>${o.p}</b> × ${o.qty} · ${m(o.amt)}<p class="mut">${o.b} ⇄ ${o.s}</p><div class="tl">${ST.slice(0,11).map((s,i)=>`<div class="${i<=o.st?'d':''}">${s}</div>`).join('')}</div>${o.st<10?`<button class="b" data-a="adv" data-id="${o.id}">Advance status (seller)</button> `:''}<button class="b b2" data-a="cancel" data-id="${o.id}">Cancel order</button></div>`},
payments:()=>`<h1>Payments</h1>${tbl(['Ref','Order','Currency','Amount','Status','Provider'],D.PAY.map(p=>[p[0],p[1],p[2],p[3],bd(p[4],p[4]=='Paid'?'ok':'wr'),p[5]]))}<br><div class="c"><b>Payment details</b><p class="mut">Processed by approved providers. This platform does not hold funds.</p><button class="b" data-a="pay">Pay with Flutterwave (demo)</button></div>`,
shipments:()=>`<h1>Shipments</h1><div class="g">${D.SH.map(s=>`<div class="c"><b>${s.id}</b> · ${s.o}<div class="mut">${s.co}</div><p>${s.f} → ${s.t}</p><div class="bar"><i style="width:${s.pct}%"></i></div><p>${bd(s.st,s.pct==100?'ok':'wr')} Now: ${s.loc} · ETA ${s.eta}</p></div>`).join('')}</div>`,
logi:()=>`<div class="row sp"><h1>Logistics directory</h1><a class="b" href="#/shipq">Request shipping quote</a></div><div class="g">${D.B.filter(b=>b.t=='Logistics').map(b=>`<div class="c"><b>${b.n}</b> ${vb(b)}<p class="mut">Sea · Air · Road · Container · Express</p></div>`).join('')}</div>`,
shipq:()=>`<h1>Request shipping quote</h1><form class="c" data-f="shipq">${fld('Origin','o')}${fld('Destination','d')}<label>Method<select name="m">${opts(['Sea freight','Air freight','Road','Rail','Container','Bulk cargo','Express'])}</select></label>${fld('Cargo weight (kg)','w','number')}<button class="b">Request quote</button></form>`,
docs:()=>`<h1>Trade documents</h1>${tbl(['Document','Order','Status'],D.DOC.map(d=>[d[0],d[1],bd(d[2],d[2]=='Approved'?'ok':'wr')]))}<br><form class="c" data-f="doc"><label>Upload document<select name="n">${opts(['Commercial invoice','Proforma invoice','Packing list','Bill of lading','Certificate of origin','Export permit','Import permit','Inspection certificate'])}</select></label><input type="file" required><button class="b">Upload</button></form>`,
reviews:()=>`<h1>Reviews</h1><div class="g">${D.REV.map(r=>`<div class="c">${'⭐'.repeat(r[2])}<p>${E(r[3])}</p><div class="mut">${r[0]} → ${r[1]}</div></div>`).join('')}</div><h2>Leave a review</h2><form class="c" data-f="rev"><label>Overall rating<select name="s">${opts([5,4,3,2,1])}</select></label>${fld('Feedback','t','textarea')}<button class="b">Submit review</button></form>`,
disputes:()=>`<h1>Disputes</h1>${tbl(['ID','Order','Reason','Status'],D.DIS.map(d=>[d.id,d.o,d.r,bd(d.st,'wr')]))}<h2>Open a dispute</h2><form class="c" data-f="dis"><label>Order<select name="o">${opts(D.O.map(o=>o.id))}</select></label><label>Issue<select name="r">${opts(['Incorrect products','Product quality','Non-delivery','Delayed shipment','Payment problems','Misrepresentation'])}</select></label>${fld('Explain the problem','d','textarea')}<button class="b">Submit dispute</button></form>`,
notifications:()=>`<h1>Notifications</h1>${D.N.map((n,i)=>`<div class="c row sp" style="margin-bottom:8px"><span>${n[1]?'':'🔵 '}${n[0]}</span>${n[1]?'':`<button class="b b2 bs" data-a="read" data-i="${i}">Mark read</button>`}</div>`).join('')}`,
saved:()=>`<h1>Saved</h1><div class="g">${D.P.filter(p=>S.saved.includes(p.id)).map(pcard).join('')||em('Nothing saved yet. Save products from the marketplace.')}</div>`,
myprod:()=>`<div class="row sp"><h1>My products</h1><button class="b" data-a="addp">Add product</button></div><div class="g">${D.P.filter(p=>p.s==2).map(pcard).join('')}</div>`,
dash:()=>{const g=grp(S.u.r),k={buyer:[['Open RFQs',D.RFQ.length],['Active orders',2],['Shipments',2],['Unread messages',3]],seller:[['Products',3],['RFQ opportunities',2],['Orders',3],['Revenue',m(238000)]],logistics:[['Shipping requests',4],['Active shipments',2],['Quotes sent',7],['Completed',18]],investor:[['Businesses',D.B.length],['Opportunities',5],['Inquiries',2],['Saved',S.saved.length]]}[g];return`<h1>Welcome, ${E(S.u.e.split('@')[0])}</h1><p class="mut">${S.u.r} account · ${bd('Verification: Pending','wr')}</p><div class="g">${k.map(a=>stat(a[0],a[1])).join('')}</div><h2>Activity</h2>${chart([30,45,40,60,55,75,90])}${g=='investor'?'<p class="mut">Investment opportunities are subject to verification and legal requirements. No returns are promised.</p>':''}`},
admin:()=>`<h1>Admin dashboard</h1><div class="g">${[['Users',1284],['Verified businesses',412],['Pending verification',D.VER.filter(v=>v.st=='Pending').length],['Orders',860],['Open disputes',7],['Refund requests',3]].map(a=>stat(a[0],a[1])).join('')}</div><h2>Registrations</h2>${chart([20,35,30,50,65,60,85])}`,
'a-users':()=>`<h1>User management</h1>${tbl(['Name','Email','Type','Status',''],D.USERS.map((u,i)=>[u[0],u[1],u[2],bd(u[3],u[3]=='Active'?'ok':'er'),`<button class="b b2 bs" data-a="tog" data-i="${i}">${u[3]=='Active'?'Suspend':'Restore'}</button>`]))}`,
'a-verify':()=>`<h1>Business verification</h1>${D.VER.map((v,i)=>`<div class="c row sp" style="margin-bottom:8px"><span><b>${v.n}</b> (${v.k}) · ${v.docs} documents ${bd(v.st,v.st=='Verified'?'ok':v.st=='Rejected'?'er':'wr')}</span>${v.st=='Pending'?`<span><button class="b bs" data-a="ver" data-i="${i}" data-v="Verified">Approve</button> <button class="b b2 bs" data-a="ver" data-i="${i}" data-v="Rejected">Reject</button></span>`:''}</div>`).join('')}`,
'a-orders':()=>V.orders(),'a-pay':()=>V.payments(),'a-disp':()=>`<h1>Dispute management</h1>${tbl(['ID','Order','Reason','Status',''],D.DIS.map((d,i)=>[d.id,d.o,d.r,bd(d.st,d.st=='Closed'?'ok':'wr'),d.st!='Closed'?`<button class="b bs" data-a="close" data-i="${i}">Record decision and close</button>`:'']))}`,
'a-an':()=>`<h1>Analytics</h1><div class="g"><div><b>Orders per month</b>${chart([25,40,35,55,70,65,90])}</div><div><b>Revenue per month</b>${chart([15,30,45,40,60,80,75])}</div></div>`};
function toast(t){const e=$('#t');e.innerHTML=`<div class="toast">${E(t)}</div>`;setTimeout(()=>e.innerHTML='',2200)}
function render(){let[p,a]=location.hash.slice(2).split('/');p=p||'';const pub=['','about','how','market','product','dir','biz','rfqs','rfq','logi','pricing','contact','terms','privacy','help','login','register'];if(!pub.includes(p)&&!S.u){location.hash='#/login';return}
const u=S.u,tabs=u?roleTabs[grp(u.r)]:null,pg=V[p]?V[p](a):em('Page not found.');
$('#app').innerHTML=`<header><div class="w"><div class="hd"><a class="logo" href="#/">🌐 SAAGE <i>Free Trade Zone</i></a><div class="row"><select id="cur" style="width:auto;margin:0;padding:3px">${Object.keys(R).map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select>${u?`<a href="#/notifications" style="color:#fff">🔔${D.N.filter(n=>!n[1]).length}</a><a href="#" data-a="out" style="color:#fff">Sign out</a>`:'<a class="b bs" href="#/login">Sign in</a>'}</div></div><nav>${[['market','Marketplace'],['dir','Directory'],['rfqs','RFQs'],['logi','Logistics'],['how','How it works'],['pricing','Pricing'],['help','Help']].map(a=>`<a href="#/${a[0]}">${a[1]}</a>`).join('')}</nav></div></header>${tabs?`<div class="tabs">${tabs.map(t=>`<a href="#/${t[0]}" class="${t[0]==p?'on':''}">${t[1]}</a>`).join('')}</div>`:''}<main>${pg}<p class="mut" style="font-size:12px">Converted prices are estimates. Original transaction currency is shown in USD.</p></main><footer>Test mode with sample data. Not a bank. <a href="#/about">About</a> · <a href="#/contact">Contact</a> · <a href="#/terms">Terms</a> · <a href="#/privacy">Privacy</a></footer>`;scrollTo(0,0)}
document.addEventListener('input',e=>{const k=e.target.dataset.q;if(!k)return;S.q[k]=e.target.type=='checkbox'?e.target.checked:e.target.value;$('#res').innerHTML=S.rf()});
document.addEventListener('change',e=>{if(e.target.id=='cur'){S.cur=e.target.value;render()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const d=t.dataset,i=+d.i;switch(d.a){
case'out':S.u=null;localStorage.removeItem('u');location.hash='#/';render();break;
case'save':S.saved.includes(+d.id)?S.saved=S.saved.filter(x=>x!=d.id):S.saved.push(+d.id);toast('Saved list updated');render();break;
case'quote':if(!S.u){location.hash='#/login';break}toast('Quotation request sent to supplier');break;
case'order':if(!S.u){location.hash='#/login';break}{const p=D.P.find(x=>x.id==d.id);D.O.unshift({id:'ORD-'+(1004+D.O.length),p:p.n,qty:p.moq,amt:p.p*p.moq,b:'Your business',s:bz(p.s).n,st:0});toast('Order created');location.hash='#/orders'}break;
case'acc':case'rej':{const r=D.RFQ.find(x=>x.id==d.r);r.quotes.forEach(q=>{if(q.id==d.q)q.st=d.a=='acc'?'Accepted':'Rejected';else if(d.a=='acc')q.st='Rejected'});if(d.a=='acc')r.st='Awarded';toast('Quotation '+(d.a=='acc'?'accepted':'rejected'));render()}break;
case'chat':S.ch=i;render();break;
case'adv':{const o=D.O.find(x=>x.id==d.id);o.st++;toast('Status: '+ST[o.st]);render()}break;
case'cancel':D.O.find(x=>x.id==d.id).st=11;toast('Order cancelled');render();break;
case'pay':toast('Demo only: real payments are confirmed by the server');break;
case'read':D.N[i][1]=1;render();break;
case'tog':D.USERS[i][3]=D.USERS[i][3]=='Active'?'Suspended':'Active';render();break;
case'ver':D.VER[i].st=d.v;toast('Business '+d.v.toLowerCase());render();break;
case'close':D.DIS[i].st='Closed';toast('Dispute closed');render();break;
case'addp':toast('Product form opens here in the full build');break}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(e.target));switch(f){
case'login':S.u={e:v.e,r:v.r};try{localStorage.setItem('u',JSON.stringify(S.u))}catch(x){}location.hash='#/'+(v.r=='admin'?'admin':'dash');render();break;
case'rfq':D.RFQ.unshift({id:D.RFQ.length+1,t:v.t,cat:v.cat,q:+v.q,u:v.u,tp:+v.tp,dest:v.dest.toUpperCase(),by:v.by,st:'Open',buyer:'Your business',quotes:[]});toast('RFQ published');location.hash='#/rfqs';break;
case'quote':D.RFQ.find(x=>x.id==e.target.dataset.r).quotes.push({id:Date.now(),s:'Your business',p:+v.p,q:+v.q,days:+v.days,st:'Pending'});toast('Quotation submitted');render();break;
case'msg':D.CHAT[S.ch].push(['me',v.t]);render();break;
case'doc':D.DOC.unshift([v.n,'-','Pending']);toast('Document uploaded for review');render();break;
case'rev':D.REV.unshift(['You','Supplier',+v.s,v.t]);toast('Review submitted');render();break;
case'dis':D.DIS.unshift({id:'DSP-'+(202+D.DIS.length),o:v.o,r:v.r,st:'Under review'});toast('Dispute opened');render();break;
default:toast('Sent (test mode)');e.target.reset()}});
addEventListener('hashchange',render);render();
</script></body></html>
